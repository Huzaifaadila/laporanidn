<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan | E-Report</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>

    <nav class="navbar topbar px-4">
        <span class="navbar-brand text-white fw-bold">
            E-Report <span class="brand-light">Santri</span> 
        </span>
        <div class="admin-profile">
            <div>
                <span>Admin</span>
                <small>Pengelola Sistem</small>
            </div>
            <div class="admin-avatar">AD</div>
        </div>
    </nav>
    <div class="row g-0">
        <aside class="sidebar col-lg-2 p-4">
            <h5 class="menu-label">Menu</h5>
            <a href="dsbrd.html" class="menu-link"><i class="bi bi-bar-chart"></i> Dashboard</a>
            <a href="statistik.html" class="menu-link"><i class="bi bi-clipboard-data"></i> Data Laporan</a>
            <a href="setting.html" class="menu-link active" aria-current="page"><i class="bi bi-gear"></i> Pengaturan</a>
        </aside>
        <main class="col-lg-10 p-4">
            <h2>Pengaturan</h2>
            <p>Kelola informasi admin.</p>

            <div id="pesanSimpan" class="alert alert-success d-none" role="status"></div>

            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-person-circle"></i> Administrator</h5>
                        </div>
                        <div class="card-body">
                            <form id="formAdmin">
                                <div class="mb-3">
                                    <label for="namaAdmin" class="form-label">Nama Admin</label>
                                    <input type="text" id="namaAdmin" value="Admin Santri" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="emailAdmin" class="form-label">Email</label>
                                    <input type="email" id="emailAdmin" value="Admin@idn.com" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="jabatanAdmin" class="form-label">Jabatan</label>
                                    <input type="text" id="jabatanAdmin" value="Administrator" class="form-control">
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-floppy"></i>
                                    Simpan profil
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-app-indicator"></i> Nama Aplikasi</h5>
                        </div>
                        <div class="card-body">
                            <form id="formApp">
                                <div class="mb-3">
                                    <label for="namaApp" class="form-label">Nama Aplikasi</label>
                                    <input type="text" id="namaApp" value="E-Report Santri" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="namaSekolah" class="form-label">Nama Sekolah</label>
                                    <input type="text" id="namaSekolah" value="IDN BS" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="deskripsiApp" class="form-label">Deskripsi Aplikasi</label>
                                    <input type="text" id="deskripsiApp" value="Sistem pelaporan pelanggaran santri" class="form-control">
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-floppy"></i>
                                    Simpan pengaturan
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi bi-bell text-warning fs-4"></i>
                                    <h5 class="mb-0">Preferensi sistem</h5>
                                </div>
                                <div class="form-check form-switch">
                                    <input type="checkbox" role="switch" class="form-check-input" id="notif">
                                    <label for="notif" class="form-check-label">Aktifkan notifikasi</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simpan ke localStorage supaya isian tidak hilang saat halaman dimuat ulang.
        const KUNCI = "ereport:setting";
        const simpan = JSON.parse(localStorage.getItem(KUNCI) || "{}");
        const pesan = document.getElementById("pesanSimpan");

        document.querySelectorAll("main input").forEach(el => {
            if (!(el.id in simpan)) return;
            if (el.type === "checkbox") el.checked = simpan[el.id];
            else el.value = simpan[el.id];
        });

        function tampilPesan(teks) {
            pesan.textContent = teks;
            pesan.classList.remove("d-none");
            clearTimeout(tampilPesan.t);
            tampilPesan.t = setTimeout(() => pesan.classList.add("d-none"), 3000);
        }

        document.querySelectorAll("form").forEach(form => {
            form.addEventListener("submit", e => {
                e.preventDefault();
                form.querySelectorAll("input").forEach(el => { simpan[el.id] = el.value; });
                localStorage.setItem(KUNCI, JSON.stringify(simpan));
                tampilPesan("Perubahan disimpan di browser ini.");
            });
        });

        document.getElementById("notif").addEventListener("change", e => {
            simpan.notif = e.target.checked;
            localStorage.setItem(KUNCI, JSON.stringify(simpan));
            tampilPesan(e.target.checked ? "Notifikasi diaktifkan." : "Notifikasi dimatikan.");
        });
    </script>
</body>
</html>
