<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Laporan | E-Report</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>

    <nav class="navbar topbar px-4">
        <span class="navbar-brand text-white fw-bold">
            E-Report <span class="brand-light">Santri</span> 
        </span>
        <div class="admin-profile">
            <div>
                <span>Admin</span>
                <small>Pengelola sistem</small>
            </div>
            <div class="admin-avatar">AD</div>
        </div>
    </nav>
    <div class="row g-0">
        <aside class="sidebar col-lg-2 p-4">
            <h5 class="menu-label">Menu</h5>
            <a href="dsbrd.html" class="menu-link"><i class="bi bi-bar-chart"></i> Dashboard</a>
            <a href="statistik.html" class="menu-link active" aria-current="page"><i class="bi bi-clipboard-data"></i> Data Laporan</a>
            <a href="setting.html" class="menu-link"><i class="bi bi-gear"></i> Pengaturan</a>
        </aside>
        <main class="col-lg-10 p-4">
            <h2>Data Laporan Statistik</h2>

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <h5>Statistik Laporan</h5>
                            <p>Jumlah laporan santri setiap bulan</p>
                            <div class="area-grafik">
                                <canvas id="santriChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-body">
                            <h5>Status Laporan</h5>
                            <p>Laporan santri </p>
                            <div class="area-grafik">
                                <canvas id="laporanChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        const ctx = document.getElementById('santriChart')

        new Chart(ctx, {
            type: 'bar',
            data:{
                labels: ["Januari", "Februari", "Maret", "April", "Mei"],
                datasets: [{
                    label : "jumlah laporan per-bulan",
                    data: [10,20,13,22,5],
                    backgroundColor: "royalblue",
                    borderRadius: 6
                }]
            },
            options:{
                maintainAspectRatio: false,
                plugins:{
                    legend:{
                        position: "bottom"
                    }
                }
            }
        })
        const ct2 = document.getElementById('laporanChart')

        new Chart(ct2, {
            type: 'doughnut',
            data:{
                labels: ["Waiting", "Accepted", "Declined"],
                datasets: [{
                    label : "jumlah laporan santri",
                    data: [10,20,13],
                    backgroundColor: [
                        "#ffc107",
                        "#198754",
                        "#dc3545"
                    ],
                    borderWidth: 3
                }]
            },
            options:{
                maintainAspectRatio: false,
                plugins:{
                    legend:{
                        position: "bottom"
                    }
                }
            }
        })
    </script>
</body>
</html>
